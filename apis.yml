name: Konfig
kind: company
description: Konfig is an SDK and API documentation generator that turns an OpenAPI Specification or Postman Collection
  into production-ready client libraries, interactive reference docs, demos, and tutorials. It generates and publishes
  idiomatic SDKs across TypeScript/JavaScript, Python, Java, C#, PHP, Ruby, Go, Swift, Kotlin, Objective-C, and
  Dart, republishing them automatically whenever the spec changes, and adds spec linting and generated SDK tests
  to keep client libraries in sync across the API lifecycle. Konfig is driven from a CLI (konfig-cli) and a konfig.yaml
  config that calls Konfig's hosted generation backend - it is a developer-tooling platform, not a hosted public
  REST API of its own. Konfig was sunset in December 2024 and its full codebase was open-sourced (MIT) at github.com/konfig-dev/konfig;
  the marketing site, docs, and 491 generated SDK repositories at github.com/konfig-sdks remain online.
